name: WakaTime Stats

on:
  schedule:
    # Runs at 12 AM UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with WakaTime Stats
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          # Content
          SHOW_TITLE: false
          SECTION_NAME: waka
          BLOCKS: "=>"
          TIME_RANGE: last_7_days
          LANG_COUNT: 10
          SHOW_TIME: true
          SHOW_TOTAL: true
          SHOW_MASKED_TIME: false
          STOP_AT_OTHER: false

          # Hide unwanted languages
          IGNORED_LANGUAGES: "YAML JSON TOML"
